name: Android debug APK

on:
  push:
    branches:
      - main
      # Temporaneo: validazione della pipeline prima del merge su main (M0).
      - ccr-94004694-d22pll
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2" # deve coincidere con il tag dell'immagine e con config/features in project.godot

jobs:
  export-android:
    name: Esporta APK debug
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Installa export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Genera keystore di debug
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$RUNNER_TEMP/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Importa il progetto
        run: godot --headless --verbose --import || true

      - name: Esporta APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --export-debug "Android Debug" build/android/racer-proto-debug.apk
          ls -l build/android
          test -s build/android/racer-proto-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: racer-proto-debug-apk
          path: build/android/racer-proto-debug.apk

  publish:
    name: Pubblica pre-release "latest"
    needs: export-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: racer-proto-debug-apk

      - name: Aggiorna la pre-release latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create latest racer-proto-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "APK debug più recente" \
            --notes "Build automatica del commit ${GITHUB_SHA::7} (${GITHUB_REF_NAME}). Solo per test."
