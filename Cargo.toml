[package]
name = "egresso"
version = "0.1.0"
edition = "2021"
default-run = "egresso"

# Per ora nessuna dipendenza: tutto quello che usiamo è scritto da noi.
# Dalla lezione 02 aggiungeremo solo ciò che serve per parlare col sistema
# operativo (finestra e audio).
[dependencies]
winit = "0.30"
softbuffer = "0.4"

[profile.dev]
# Il gioco deve girare fluido anche in debug: ottimizziamo un po' il nostro
# codice e molto le dipendenze.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
