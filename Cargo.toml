[package]
name = "egresso"
version = "0.1.0"
edition = "2021"
default-run = "egresso"

[lib]
# "cdylib" serve alla build WebAssembly (web/), "rlib" a tutto il resto.
crate-type = ["cdylib", "rlib"]

# Le uniche dipendenze servono a parlare col sistema operativo (finestra e
# pixel sullo schermo). Nel browser non servono: lì parla la pagina web.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = "0.30"
softbuffer = "0.4"

[profile.dev]
# Il gioco deve girare fluido anche in debug: ottimizziamo un po' il nostro
# codice e molto le dipendenze.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
# Binari più piccoli (soprattutto per il web).
lto = true
codegen-units = 1
panic = "abort"
